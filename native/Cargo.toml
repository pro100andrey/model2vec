[package]
name = "m2v_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
anyhow = "1.0.102"
serde_json = "1.0.150"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
safetensors = "0.7.0"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
ureq = "3.3.0"
half = "2.7.1"

# Release is the profile the build hook uses. `panic = "unwind"` is left at the
# default on purpose — the FFI boundary relies on catch_unwind to turn panics
# into typed errors instead of aborting the host process.
[profile.release]
lto = true
codegen-units = 1
