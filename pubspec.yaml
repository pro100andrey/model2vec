name: model2vec
description: On-device Model2Vec text embeddings for Dart & Flutter — a self-contained Rust core via FFI and Native Assets. Fast, local, static, minimal memory.
version: 2.0.2
repository: https://github.com/pro100andrey/model2vec
homepage: https://github.com/pro100andrey/model2vec
issue_tracker: https://github.com/pro100andrey/model2vec/issues

topics:
  - rag
  - nlp
  - embeddings
  - tokenizer
  - model2vec

environment:
  sdk: "^3.10.0"

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.2.0
  hooks: ^2.1.0
  path: ^1.9.1

dev_dependencies:
  benchmark_harness: ^2.4.0
  ffigen: ^21.0.0
  pro_lints: ^6.2.0
  test: ^1.31.2

ffigen:
  name: Model2VecBindings
  description: Bindings for model2vec-rs.
  output: "lib/src/model2vec_bindings.g.dart"
  ffi-native:
    asset-id: "package:model2vec/model2vec.so"
  headers:
    entry-points:
      - "native/model2vec.h"
    include-directives:
      - "**/model2vec.h"
  preamble: |
    // ignore_for_file: always_specify_types
    // ignore_for_file: camel_case_types
    // ignore_for_file: non_constant_identifier_names
