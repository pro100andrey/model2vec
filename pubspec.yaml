name: model2vec
description: A Dart wrapper for model2vec-rs using Rust FFI.
version: 0.1.0

environment:
  sdk: "^3.12.0"

dependencies:
  code_assets: ^1.1.0
  ffi: ^2.2.0
  hooks: ^2.0.0
  path: ^1.9.1
  
dev_dependencies:
  benchmark_harness: ^2.4.0
  ffigen: ^20.1.1
  native_assets_cli: ^0.18.0
  pro_lints: ^6.0.0
  test: ^1.31.1

ffigen:
  name: Model2VecBindings
  description: Bindings for model2vec-rs.
  output: "lib/src/model2vec_bindings.g.dart"
  headers:
    entry-points:
      - "native/model2vec.h"
  preamble: |
    // ignore_for_file: always_specify_types
    // ignore_for_file: camel_case_types
    // ignore_for_file: non_constant_identifier_names
